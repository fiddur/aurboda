name: Build Android APK

# develop → pre-release on the fixed tag `beta` (beta channel; not `develop`,
#           a tag named like a branch shadows it in git ref resolution)
# main    → release v1.0.<versionCode>, marked latest (stable channel)
# The APK built on each branch follows its own channel, see
# VERSION_JSON_URL in apps/android/app/build.gradle.kts.
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version code
        id: version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Calculated version code: $VERSION_CODE"

      - name: Pick release channel
        id: channel
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=stable" >> $GITHUB_OUTPUT
            echo "tag=v1.0.${{ steps.version.outputs.VERSION_CODE }}" >> $GITHUB_OUTPUT
            echo "version_json_url=$REPO_URL/releases/latest/download/version.json" >> $GITHUB_OUTPUT
            echo "download_url=$REPO_URL/releases/latest/download/aurboda.apk" >> $GITHUB_OUTPUT
          else
            echo "name=beta" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "version_json_url=$REPO_URL/releases/download/beta/version.json" >> $GITHUB_OUTPUT
            echo "download_url=$REPO_URL/releases/download/beta/aurboda.apk" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google no longer serves the obsolete `tools` package, which the
          # pinned v3 still asks for by default and then fails on.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install api-spec dependencies
        working-directory: .
        run: pnpm --filter @aurboda/api-spec install

      - name: Generate Kotlin models from OpenAPI
        working-directory: .
        run: pnpm --filter @aurboda/api-spec build && pnpm --filter @aurboda/api-spec generate

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/aurboda-release.keystore

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "aurbodaApiToken=${{ secrets.AURBODA_API_TOKEN }}" >> local.properties
          echo "KEYSTORE_FILE=aurboda-release.keystore" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> local.properties

      - name: Build release APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_JSON_URL: ${{ steps.channel.outputs.version_json_url }}
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aurboda-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/android/app/build/reports/tests/
          retention-days: 7

      - name: Prepare APK for release
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/aurboda.apk

      - name: Generate version.json
        if: github.event_name == 'push'
        run: |
          cat > app/build/outputs/apk/release/version.json << EOF
          {
            "versionCode": ${{ steps.version.outputs.VERSION_CODE }},
            "versionName": "1.0.${{ steps.version.outputs.VERSION_CODE }}",
            "downloadUrl": "${{ steps.channel.outputs.download_url }}",
            "releaseNotes": "Built from commit ${{ github.sha }} (${{ steps.channel.outputs.name }})"
          }
          EOF

      - name: Publish development pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          # One moving pre-release on the fixed tag `beta`. Being a pre-release
          # it is never what releases/latest resolves to, so stable installs
          # (channel = releases/latest) do not see it. --target pins the tag to
          # the commit that was built (gh would otherwise use the default branch).
          gh release delete beta --yes || true
          git tag -d beta || true
          git push origin :refs/tags/beta || true
          gh release create beta \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Latest Development Build" \
            --notes "Automatically updated on each push to develop. Beta channel: installs from this APK keep following develop.

          **Download:** [aurboda.apk](${{ steps.channel.outputs.download_url }})

          Built from commit: ${{ github.sha }}
          Version code: ${{ steps.version.outputs.VERSION_CODE }}" \
            apps/android/app/build/outputs/apk/release/aurboda.apk \
            apps/android/app/build/outputs/apk/release/version.json

      - name: Publish stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          # Re-running a failed job must not trip over a half-made release.
          gh release delete "${{ steps.channel.outputs.tag }}" --yes --cleanup-tag || true
          # --target: the default branch is develop, so without it the v1.0.N tag
          # would be created at develop's tip instead of this main commit.
          gh release create "${{ steps.channel.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --latest \
            --title "Aurboda 1.0.${{ steps.version.outputs.VERSION_CODE }}" \
            --notes "Stable release from main. Installs from this APK follow releases/latest.

          **Download:** [aurboda.apk](${{ steps.channel.outputs.download_url }})

          Built from commit: ${{ github.sha }}
          Version code: ${{ steps.version.outputs.VERSION_CODE }}" \
            apps/android/app/build/outputs/apk/release/aurboda.apk \
            apps/android/app/build/outputs/apk/release/version.json
          # Before stable/beta channels existed, the develop build lived on a
          # release named `latest`. Remove it once a real stable release exists so
          # releases/latest resolves to this one. (Download links use the
          # releases/latest/download/... form, which does not depend on a tag
          # named `latest`.)
          gh release delete latest --yes --cleanup-tag || true
